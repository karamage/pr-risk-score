# .github/workflows/pr-risk.yml
# Deterministic gate: comment + labels on every PR. No API keys, ~5 seconds.
name: pr-risk-score
on:
  pull_request_target:          # safe: the action reads the diff via API and never runs PR code
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      # Pin to a full commit SHA for supply-chain safety (tags can be moved):
      #   uses: karamage/pr-risk-score@<40-char-sha>  # v1.0.0
      - id: risk
        uses: karamage/pr-risk-score@v1
        with:
          # threshold: 50            # or set human_review_threshold in .pr-risk.json
          # fail-on-human-review: true

